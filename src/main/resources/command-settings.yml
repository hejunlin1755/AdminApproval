# 危险命令：管理员执行这些命令时需要提交审批（可自行增删，重启后生效）
dangerous:
  - op
  - deop
  - stop
  - restart
  - reload
  - ban
  - pardon
  - whitelist
  - give
  - item
  - execute
  - gamemode
  - gm
  - gmc
  - gms
  - gma
  - gmsp
  - tp
  - teleport
  - tpo
  - tphere
  - tppos
  - tpall

# 免审批命令白名单初始值：首次启动写入 data.yml 后，以 /adminapproval whitelist 管理
whitelist:
  - fill
  - clone
  - setblock

# 禁用模式：管理员执行命中这些模式的命令时会被拦截并创建审批请求（如 //set tnt）
blocked-patterns:
  - "set tnt"
  - "replace tnt"
  - "set lava"
  - "replace lava"
  - "set bedrock"
  - "replace bedrock"
  - "set command_block"
  - "replace command_block"
  - "set barrier"
  - "replace barrier"

# 是否把管理员执行的每条命令都推送到 Telegram（默认关闭）
notify-all-admin-commands: false

# 这些命令的完整参数会被打码（如 /login 密码、/changepassword 旧密码 新密码）
sensitive-commands:
  - login
  - register
  - changepassword
  - changeemail
  - email
  - authme
  - unregister
  - password
  - pass
  - token
  - code
  - recovery

# 命令里出现这些关键词时，后面的参数也会被打码
sensitive-keywords:
  - password
  - pass
  - token
  - 密码
  - 密钥

# 普通玩家的命令也推送到 Telegram（默认关闭，注意可能很吵）
notify-player-commands: false

# 玩家加入/退出游戏推送到 Telegram（默认关闭）
notify-join-leave: false

# 反作弊告警推送到 Telegram（默认关闭）：匹配控制台日志中的反作弊 flag/violation
notify-anticheat: false
anticheat-patterns:
  - "(?i)\\[Vulcan\\].*(flag|violation)"
  - "(?i)\\[Grim(AC)?\\].*(flag|violation)"
  - "(?i)\\[HeuristicNoFall\\].*(flag|violation)"
  - "(?i)\\[XrayDetect\\].*(detect|violation)"
